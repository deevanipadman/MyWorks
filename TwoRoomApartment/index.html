<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two Room Apartment - Three.js</title>
    <style>
      html, body { height: 100%; margin: 0; }
      #app { width: 100%; height: 100%; display: block; }
      .overlay {
        position: absolute; top: 12px; left: 12px; color: #fff; font-family: Arial; z-index: 10;
        background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="overlay">Use mouse to orbit / scroll to zoom. WASD or arrow keys to move.</div>
    <canvas id="app"></canvas>
    <!-- If a bundled file exists, load it for best performance; otherwise load the module during development -->
    <script>
      (function(){
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD','/dist/bundle.js',false);
        try{ xhr.send(); }catch(e){}
        if (xhr.status === 200) {
          var s = document.createElement('script');
          s.src = '/dist/bundle.js';
          document.body.appendChild(s);
        } else {
          // dev fallback
          const im = document.createElement('script');
          im.type = 'importmap';
          im.textContent = JSON.stringify({ imports: { 'three': '/node_modules/three/build/three.module.js' } });
          document.head.appendChild(im);
          var m = document.createElement('script');
          m.type = 'module';
          m.src = './src/app.js';
          document.body.appendChild(m);
        }
      })();
    </script>
  </body>
</html>
