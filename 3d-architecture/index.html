<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Architecture Tour</title>
  <style>
  body {
  margin: 0;
  overflow: hidden;
  font-family: 'Times New Roman', serif;
}

/* Sidebar styling */
#sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 250px;
  height: 100%;
  background: linear-gradient(#62a5e4, #e9e9e9);
  box-shadow: 2px 0 6px rgba(42, 29, 29, 0.1);
  padding: 20px;
  z-index: 5;
}

#sidebar h3 {
  color: #0f0e0e;
  margin-bottom: 0.5px;
}

#sidebar button {
  width: 100%;
  margin-bottom: 8px;
  padding: 8px;
  border: none;
  border-radius: 4px;
  background: #1976d2;
  color: #fff;
  cursor: pointer;
}
#sidebar button:hover {
  background: #1259a2;
}

/* Canvas area */
canvas {
  display: block;
  margin-left: 250px;
}

/* Camera control buttons */
#controls {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: flex;
  flex-wrap: wrap;
  width: 150px;
  gap: 5px;
  justify-content: center;
  z-index: 10;
}

#controls h4 {
  width: 100%;
  text-align: center;
  font-size: 15px;
  color: #000;
  margin: 0 0 6px 0;
  font-weight: 700;
}

#controls button {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 4px;
  background: #fff;
  color: #333;
  font-size: 18px;
  font-weight: bold;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  cursor: pointer;
  transition: all 0.2s ease;
}

#controls button:hover {
  background: #1976d2;
  color: white;
}
</style>
  
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar">
    <h3>3D Architecture Tour</h3>
    <hr>
    <p>
      Welcome!<br>
      Explore our interactive 3D Two-Room model.
    </p>
    <ul>
      <li>View living room layout</li><br>
      <li>View bedroom layout</li><br>
      <li>Switch between floors</li><br>
      <li>Zoom, pan, and rotate the model</li>
    </ul>
    <button id="reset">Go to Home View</button>
  </div>

  <!-- Control buttons -->
  <div id="controls">
    <h4>Control Buttons</h4>
    <button id="zoomIn">+</button>
    <button id="zoomOut">−</button>
    <button id="moveLeft">←</button>
    <button id="moveRight">→</button>
    <button id="moveUp">↑</button>
    <button id="moveDown">↓</button>
  </div>

  <!-- Three.js import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js"
    }
  }
  </script>

  <!-- Main JS -->
  <script type="module" src="main.js"></script>
</body>
</html>
